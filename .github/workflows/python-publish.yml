name: Publish Python Package to PyPI

# Runs only when a GitHub release is published (not on push or merge).
# The release tag must match homismart_client.__version__ exactly, e.g. tag
# v0.3.0 for __version__ = "0.3.0"; otherwise nothing is published.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install
        run: python -m pip install -e . pytest pytest-asyncio
      - name: Run tests
        run: python -m pytest

  build:
    name: Build Python package
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Check release tag matches package version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION=$(python -c "import re; print(re.search(r'__version__ = [\"\x27]([^\"\x27]+)', open('homismart_client/__init__.py').read()).group(1))")
          echo "Release tag: $TAG, package version: $VERSION"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Release tag $TAG does not match __version__ $VERSION. Nothing was published."
            exit 1
          fi

      - name: Build distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check --strict dist/*

      - name: Smoke-test the built wheel
        run: |
          python -m venv /tmp/wheeltest
          /tmp/wheeltest/bin/pip install dist/*.whl
          cd /tmp && /tmp/wheeltest/bin/python -c "import homismart_client as h; print(h.__version__); assert h.__version__ == '${GITHUB_REF#refs/tags/v}'"

      - name: Upload dist artifacts for next job
        uses: actions/upload-artifact@v7
        with:
          name: release-dist
          path: dist/

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build]
    environment:
      name: pypi
      url: https://pypi.org/project/homismart-client
    permissions:
      id-token: write  # Trusted publishing; no API token stored in the repo.
    steps:
      - name: Download built distributions
        uses: actions/download-artifact@v8
        with:
          name: release-dist
          path: dist/

      - name: Publish to PyPI via trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
